# -----------------------------------------------------------------------------
# Shell
# -----------------------------------------------------------------------------

shell zsh -l

# -----------------------------------------------------------------------------
# Dracula, matching the Kitty Dracula theme, with the background changed
# from #282a36 to #202020 as in the WezTerm configuration.
# -----------------------------------------------------------------------------

foreground            #f8f8f2
background            #202020

selection_foreground  #ffffff
selection_background  #44475a

url_color             #8be9fd

color0   #21222c
color8   #6272a4

color1   #ff5555
color9   #ff6e6e

color2   #50fa7b
color10  #69ff94

color3   #f1fa8c
color11  #ffffa5

color4   #bd93f9
color12  #d6acff

color5   #ff79c6
color13  #ff92df

color6   #8be9fd
color14  #a4ffff

color7   #f8f8f2
color15  #ffffff

cursor                 #f8f8f2
cursor_text_color      background
cursor_blink_interval  0

active_tab_foreground    #282a36
active_tab_background    #f8f8f2
inactive_tab_foreground  #282a36
inactive_tab_background  #6272a4


# -----------------------------------------------------------------------------
# Tabs
# -----------------------------------------------------------------------------

tab_bar_edge bottom

# Equivalent to hide_tab_bar_if_only_one_tab = true
tab_bar_min_tabs 2


# -----------------------------------------------------------------------------
# Bell
# -----------------------------------------------------------------------------

enable_audio_bell no


# -----------------------------------------------------------------------------
# Window
# -----------------------------------------------------------------------------

hide_window_decorations yes

allow_remote_control socket-only
listen_on unix:@kitty-{kitty_pid}


# -----------------------------------------------------------------------------
# Close confirmation
#
# Negative value + shell integration means windows currently sitting at a
# shell prompt do not count as running processes for confirmation purposes.
# -----------------------------------------------------------------------------

shell_integration enabled
confirm_os_window_close -1

# If you want Ctrl+Shift+W itself to request confirmation for running programs:
map ctrl+shift+w close_window_with_confirmation ignore-shell

# Disable Kitty's default Ctrl+Shift+F mapping.
# Kitty normally uses it for move_window_forward.
map ctrl+shift+f

font_size 11.0
# BEGIN_KITTY_FONTS
font_family      family='RobotoMono Nerd Font Mono' style=Light
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
